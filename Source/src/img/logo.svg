  <path d="M96 400 V272 a60 60 0 0 1 60-60 H300 a60 60 0 0 0 60-60 V112" fill="none" stroke="url(#rd)" stroke-width="12" stroke-opacity=".0"/>
  <path d="M96 400 V272 a60 60 0 0 1 60-60 H300 a60 60 0 0 0 60-60 V128" fill="none" stroke="#F1F5FB" stroke-width="7" stroke-dasharray="26 22" stroke-linecap="round"/>
