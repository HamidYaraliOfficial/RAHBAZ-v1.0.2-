  <path d="M360 40 L424 120 H384 V160 H336 V120 H296 Z" fill="#15B887"/>
  <path d="M360 40 L424 120 H384 V160 H336 V120 H296 Z" fill="none" stroke="#0E7A5A" stroke-width="5" stroke-linejoin="round"/>
