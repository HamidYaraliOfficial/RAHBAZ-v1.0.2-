<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16396F"/><stop offset="1" stop-color="#0B1F3A"/></linearGradient>
    <linearGradient id="rd" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#2D6BFF"/><stop offset="1" stop-color="#5C93FF"/></linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#2D6BFF" stroke-opacity=".5" stroke-width="6"/>
